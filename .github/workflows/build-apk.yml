name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Unpack app icons
        run: |
          if [ -f .github/workflows/icons.zip ]; then
            mkdir -p app/src/main/res
            unzip -o .github/workflows/icons.zip -d app/src/main/res
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        env:
          SV_KEY_PASSWORD: ${{ secrets.SV_KEY_PASSWORD }}
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
        env:
          SV_KEY_PASSWORD: ${{ secrets.SV_KEY_PASSWORD }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartVisionAssistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartVisionAssistant-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

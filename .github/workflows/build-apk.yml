name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Unpack app icons
        run: |
          if [ -f .github/workflows/icons.zip ]; then
            mkdir -p app/src/main/res
            unzip -o .github/workflows/icons.zip -d app/src/main/res
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare signing password
        env:
          RAW_KEY_PASSWORD: ${{ secrets.SV_KEY_PASSWORD }}
        run: |
          # ننظف كلمة السر من أي رموز مخفية أو غير إنجليزية دخلت أثناء النسخ واللصق
          CLEAN=$(printf '%s' "$RAW_KEY_PASSWORD" | tr -cd 'A-Za-z0-9')
          if [ -z "$CLEAN" ]; then
            echo "SV_KEY_PASSWORD secret is missing or empty"
            exit 1
          fi
          echo "SV_KEY_PASSWORD=$CLEAN" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartVisionAssistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartVisionAssistant-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
